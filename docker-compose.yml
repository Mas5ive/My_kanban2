services:

  db:
    container_name: mkb2_postgresql
    hostname: postgresql
    image: postgres:13-alpine
    expose:
      - 5432
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data/
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 4
    networks: 
      - default
    
  cache:
    container_name: mkb2_redis
    hostname: redis
    image: redis:7.4.0-alpine
    expose:
      - 6379
    env_file:
      - .env
    volumes:
      - cache_data:/data
      - ./demo/init-demo.sh:/usr/local/bin/init-redis.sh
    restart: always
    entrypoint: ["/usr/local/bin/init-redis.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - default
    
  backend:
    container_name: mkb2_django
    hostname: django
    build:
      context: .
    expose:
      - 8000
    env_file:
      - .env
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    command: |
      sh -c "
      python3 manage.py migrate &&
      python3 manage.py collectstatic --no-input &&
      python3 manage.py loaddata demo/demo-data.json &&
      exec gunicorn my_kanban2.wsgi --bind 0.0.0.0:8000
      "
    restart: always
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    networks: 
      - default

  server:
    container_name: mkb2_nginx
    hostname: nginx
    image: nginx:1.26.2-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - static:/app/staticfiles
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    restart: always
    depends_on:
      backend:
        condition: service_started
    networks: 
    - default


networks:
  default:

volumes:
  static:
  media:
  db_data:
  cache_data:
