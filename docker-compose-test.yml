services:
   

  django:
    container_name: test_django
    hostname: test_django
    build:
      context: .
    expose:
      - 8000
    environment:
      - SECRET_KEY=your-secret-key-here
      - ALLOWED_HOSTS=127.0.0.1,localhost
    restart: no
    entrypoint: ["python3", "manage.py", "test"]
    command: [".", "--parallel"]
    