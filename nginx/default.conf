limit_req_zone $binary_remote_addr zone=limitbyaddr:10m rate=2r/s;
limit_req_status 429;


server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    server_name localhost;

    limit_req zone=limitbyaddr burst=10 delay=5;

    error_page 413 /413.html;
    location = /413.html {
        root /app/staticfiles;
        internal;
    }

    ssl_certificate /etc/nginx/ssl/crt.crt;
    ssl_certificate_key /etc/nginx/ssl/key.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # This block will handle requests to create a comment.
    # It allows file uploads up to 5 MB in size.
    location ~ ^/api/v1/boards/\d+/cards/\d+/comments$ {
        client_max_body_size 5M;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /static/ {
        alias /app/staticfiles/;
    }
}
